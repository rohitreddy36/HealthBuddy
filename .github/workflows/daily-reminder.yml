name: Daily health reminder emails

on:
  schedule:
    # 00:00 UTC = 05:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily reminder endpoint
        run: |
          curl -sS -X POST "${{ secrets.REMINDER_ENDPOINT }}" \
            -H "Authorization: Bearer ${{ secrets.REMINDER_CRON_SECRET }}" \
            --fail-with-body
